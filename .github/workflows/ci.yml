name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with RUST_VERSION in the Dockerfile.
  RUST_TOOLCHAIN: "1.100"
  RUSTUP_TOOLCHAIN: "1.100"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  build:
    name: build (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p fastopm
      - name: Version
        run: ./target/release/fastopm --version || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastopm-linux-x86_64
          path: target/release/fastopm
          if-no-files-found: error
          retention-days: 7

  # Differential harness (compat/): same requests against Verdaccio 7.1.0 and the binary built
  # above, with a shared mock uplink. Non-blocking until the repository variable
  # COMPAT_REQUIRED is set to "true" (do that once the harness is clean, PLAN.md step 2).
  compat:
    name: compat harness
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ vars.COMPAT_REQUIRED != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - name: Install harness (verdaccio baseline)
        working-directory: compat
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastopm-linux-x86_64
          path: ${{ runner.temp }}/bin
      - name: Run harness
        working-directory: compat
        env:
          CANDIDATE: ${{ runner.temp }}/bin/fastopm
          RESULT: ${{ runner.temp }}/compat-result.json
        run: |
          chmod +x "$CANDIDATE"
          node run.mjs --candidate-bin "$CANDIDATE" --json "$RESULT"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-result
          path: ${{ runner.temp }}/compat-result.json
          if-no-files-found: ignore
          retention-days: 14
