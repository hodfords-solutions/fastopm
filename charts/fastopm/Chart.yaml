apiVersion: v2
name: fastopm
description: >-
  Read-only npm proxy cache written in Rust that reads Verdaccio's config.yaml and storage layout
  (no publishing, no client authentication, no web UI).
type: application
# Chart version: bump on every change under charts/fastopm (checked by `ct lint` on pull requests).
version: 0.1.0
# fastopm version deployed by default (image tag when image.tag is empty).
appVersion: "0.1.0"
kubeVersion: ">=1.23.0-0"
home: https://github.com/hodfords-solutions/fastopm
sources:
  - https://github.com/hodfords-solutions/fastopm
keywords:
  - npm
  - registry
  - proxy
  - cache
  - verdaccio
  - pnpm
  - yarn
maintainers:
  - name: hodfords-solutions
    url: https://github.com/hodfords-solutions
