{{- if .Values.secretEnvVars }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastopm.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastopm.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secretEnvVars }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
