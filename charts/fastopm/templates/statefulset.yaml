{{- if eq .Values.type "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fastopm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastopm.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "fastopm.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # Replicas are independent caches: start and update them in parallel.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "fastopm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    {{- include "fastopm.podTemplate" . | nindent 4 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          {{- include "fastopm.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- with (include "fastopm.storageClass" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- include "fastopm.tplvalues.render" (dict "value" . "context" $) | nindent 10 }}
        {{- end }}
  {{- end }}
{{- end }}
