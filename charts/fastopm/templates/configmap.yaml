{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastopm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastopm.labels" . | nindent 4 }}
data:
  config.yaml: |-
    {{- include "fastopm.tplvalues.render" (dict "value" .Values.configMap "context" $) | nindent 4 }}
{{- end }}
